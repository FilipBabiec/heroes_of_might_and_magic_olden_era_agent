name: docker

# Builds the image and runs the tests inside it, when the image could have changed.
on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-lock.txt
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t hoe-agent .

      - name: Run the tests inside the image
        run: docker run --rm hoe-agent pytest -q
